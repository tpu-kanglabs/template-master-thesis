name: Build LaTeX

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tex"
      - "**/*.cls"
      - "**/*.sty"
      - "**/*.bib"
      - ".latexmkrc"
      - "scripts/latexdiff.sh"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "**/*.tex"
      - "**/*.cls"
      - "**/*.sty"
      - "**/*.bib"
      - ".latexmkrc"
      - "scripts/latexdiff.sh"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  build-thesis:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tpu-kanglabs/texlive:latest
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/biber
          key: biber-thesis-${{ hashFiles('bibliography/*.bib') }}
          restore-keys: biber-thesis-

      - name: Build thesis
        run: latexmk thesis.tex

      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: thesis-pdf
          path: out/thesis.pdf

  build-abstract:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tpu-kanglabs/texlive:latest
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/biber
          key: biber-abstract-${{ hashFiles('bibliography/*.bib') }}
          restore-keys: biber-abstract-

      - name: Build abstract
        run: latexmk abstract.tex

      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: abstract-pdf
          path: out/abstract.pdf

  build-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tpu-kanglabs/texlive:latest
    outputs:
      thesis-url: ${{ steps.upload-thesis.outputs.artifact-url }}
      abstract-url: ${{ steps.upload-abstract.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: ~/.cache/biber
          key: biber-diff-${{ hashFiles('bibliography/*.bib') }}
          restore-keys: biber-diff-

      - name: Build diff against base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin "$BASE_REF:$BASE_REF"
          scripts/latexdiff.sh "$BASE_REF"

      - uses: actions/upload-artifact@v7
        id: upload-thesis
        with:
          name: thesis-diff-pdf
          path: out/thesis-diff${{ github.base_ref }}.pdf

      - uses: actions/upload-artifact@v7
        id: upload-abstract
        with:
          name: abstract-diff-pdf
          path: out/abstract-diff${{ github.base_ref }}.pdf

  comment:
    needs: [build-thesis, build-abstract, build-diff]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "## Build Results"

      - uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Build Results

            | Document | Link |
            |----------|------|
            | Thesis   | [Download](${{ needs.build-thesis.outputs.artifact-url }}) |
            | Abstract | [Download](${{ needs.build-abstract.outputs.artifact-url }}) |
            | Thesis (diff vs `${{ github.base_ref }}`) | [Download](${{ needs.build-diff.outputs.thesis-url }}) |
            | Abstract (diff vs `${{ github.base_ref }}`) | [Download](${{ needs.build-diff.outputs.abstract-url }}) |

            > ⚠️ Artifacts are retained for 90 days.
