[tools]
node = "26.13.1"
pnpm = "12.18.0"
uv = "0.13.8"
hk = "2.5.0"
jq = "1.8.2"
taplo = "0.10.0"
yamlfmt = "0.21.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
shfmt = "3.14.1"
hadolint = "2.15.1"

[env]
# Put project-local binaries on PATH so hk (and git hooks) can call them directly.
_.path = ["node_modules/.bin", ".venv/bin"]

[settings]
# [hooks] is still experimental in mise.
experimental = true

[hooks]
# Runs after every `mise install`, so cloning + `mise install` is the whole setup.
postinstall = { task = "setup" }

[tasks.setup]
description = "Install dependencies and Git hooks (runs after `mise install`)"
run = """
set -e
[ -f hk.pkl ] || exit 0   # no-op: the Docker image loads this file as the global config
pnpm i --frozen-lockfile
uv sync
[ -n "${CI:-}" ] || hk install --mise
"""

[tasks.abstract]
description = "Compile the abstract"
run = "latexmk abstract.tex"
sources = [
    "abstract.tex",
    "meta.tex",
    ".latexmkrc",
    "bibliography/*.bib",
    "figures/*",
    "latex/*",
]
[tasks.thesis]
description = "Compile the thesis"
run = "latexmk thesis.tex"
sources = [
    "thesis.tex",
    "meta.tex",
    ".latexmkrc",
    "bibliography/*.bib",
    "figures/*",
    "latex/*",
    "chapters/*",
]
[tasks.all]
description = "Compile everything"
depends = ["abstract", "thesis"]

[tasks."diff:head"]
description = "Build diff PDFs against HEAD"
run = "scripts/latexdiff.sh HEAD"
[tasks."diff:main"]
description = "Build diff PDFs against main"
run = "scripts/latexdiff.sh main"

[tasks.check]
description = "Run all hk checks (add `-- --step <name>` to run one step)"
run = "hk check --all"

[tasks.fix]
description = "Apply all hk auto-fixes (add `-- --step <name>` to run one step)"
run = "hk fix --all"
