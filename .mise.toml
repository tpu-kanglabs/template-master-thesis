[tools]
node = "26.13.1"
pnpm = "12.18.0"
uv = "0.13.8"
hk = "2.5.0"
jq = "1.8.2"
taplo = "0.10.0"
yamlfmt = "0.21.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
shfmt = "3.14.1"
hadolint = "2.15.1"

[env]
# Put project-local binaries on PATH so hk (and git hooks) can call them directly.
_.path = ["node_modules/.bin", ".venv/bin"]

[tasks.abstract]
description = "Compile the abstract"
run = "latexmk abstract.tex"
sources = [
    "abstract.tex",
    "meta.tex",
    ".latexmkrc",
    "bibliography/*.bib",
    "figures/*",
    "latex/*",
]
[tasks.thesis]
description = "Compile the thesis"
run = "latexmk thesis.tex"
sources = [
    "thesis.tex",
    "meta.tex",
    ".latexmkrc",
    "bibliography/*.bib",
    "figures/*",
    "latex/*",
    "chapters/*",
]
[tasks.all]
description = "Compile everything"
depends = ["abstract", "thesis"]

[tasks."diff:head"]
description = "Build diff PDFs against HEAD"
run = "scripts/latexdiff.sh HEAD"
[tasks."diff:main"]
description = "Build diff PDFs against main"
run = "scripts/latexdiff.sh main"

[tasks."format:latex"]
run = "latexindent -c out -s --overwrite *.tex chapters/*.tex"
[tasks."format:py"]
run = "uv run ruff format"
[tasks.format]
depends = ["format:*"]

[tasks."format-check:latex"]
run = "latexindent -k -s -c out *.tex chapters/*.tex"
[tasks."format-check:py"]
run = "uv run ruff format --check"
[tasks."format-check"]
depends = ["format-check:*"]

[tasks."lint:docs"]
run = "pnpm lint"
[tasks."lint:py"]
run = ["uv run ruff check", "uv run pyrefly check --summarize-errors"]
[tasks.lint]
depends = ["lint:*"]

[tasks."pre-commit"]
description = "Run all hk checks"
run = "hk check --all"
